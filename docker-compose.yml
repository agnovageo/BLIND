version: "3.7"

services:
  blind_web:
    image: ghcr.io/agnovageo/blind:latest
    environment:
      NODE_ENV: production
      PORT: "8080"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL}
    networks:
      - skammnet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=skammnet"
        - "traefik.http.routers.blind_web.rule=Host(`www.blind.pe`)"
        - "traefik.http.routers.blind_web.entrypoints=websecure"
        - "traefik.http.routers.blind_web.tls=true"
        - "traefik.http.routers.blind_web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.blind_web.loadbalancer.server.port=8080"
        - "traefik.http.routers.blind_web.service=blind_web"

networks:
  skammnet:
    external: true
    name: skammnet
